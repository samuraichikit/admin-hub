name: Check before merge to dev or main

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  check-branch:
    name: Check PR source branch
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Fail if PR is not from dev
        run: |
          if [[ "${{ github.head_ref }}" != "dev" ]]; then
            echo "Error: Pull requests to main can only come from dev."
            exit 1
          fi

  lint:
    name: Run Lint, Prettier, Stylelint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Install dependencies
        run: pnpm i

      - name: Run Prettier, ESLint, Stylelint
        run: pnpm check

      - name: Build project
        run: pnpm build
